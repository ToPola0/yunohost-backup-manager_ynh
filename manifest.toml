packaging_format = 2
id = "yunohost-backup-manager"
name = "YunoHost Backup Manager"
description.en = "Back up YunoHost applications to SMB shares"
description.pl = "Kopie zapasowe aplikacji YunoHost na udziały SMB"
version = "0.5~ynh26"
maintainers = ["ToPola0"]

[upstream]
license = "LicenseRef-Proprietary"
code = "https://github.com/ToPola0/yunohost-backup-manager_ynh"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "300M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"
    [install.path]
    type = "path"
    default = "/backup-manager"

    [install.init_main_permission]
    type = "group"
    default = "admins"

[resources]
    [resources.system_user]
    [resources.install_dir]
    dir = "/opt/yunohost-backup-manager-ynh"
    [resources.data_dir]
    subdir = "__APP__"
    [resources.permissions]
        [resources.permissions.main]
        url = "/"
        protected = true
    [resources.apt]
    packages = "python3-venv, python3-pip"
